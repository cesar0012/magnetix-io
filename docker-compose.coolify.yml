# ============================================================
# Vocero CRM — Despliegue en Coolify (proxy Traefik de Coolify)
# Alternativo a docker-compose.yml: OMITE el servicio caddy porque
# Coolify ya expone la app vía su propio proxy (Traefik) en 80/443
# con HTTPS automático por dominio.
# Uso: en Coolify, aplicación Docker Compose apuntando a este archivo.
# ============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: file:/data/db.sqlite
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
    volumes:
      - vocero_data:/data

volumes:
  vocero_data:
